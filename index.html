  /*

    @font-face {

      src: url("./assets/kwadzilla-display.woff2") format("woff2");

<body>

<!--
  The WebGL canvas is injected by the script, so a visitor with JavaScript
  off never sees an empty white box. Everything below is the real content:
  it stays in the accessibility tree at all times, and it is the whole page
  whenever WebGL is unavailable.

  data-kwad-split marks text the script splits into per-letter spans for
  the animation hooks; the original string is kept for screen readers.
-->
<main class="kwad-soon" data-kwadzilla-soon>

  <div class="kwad-soon__floor" aria-hidden="true"></div>

  <div class="kwad-soon__words">
    <h1 class="kwad-soon__word" data-kwad-split>2072</h1>
    <p class="kwad-soon__sub" data-kwad-split>Soundboy Kwad</p>
  </div>

  <p class="kwad-soon__note">Coming soon</p>

  <button class="kwad-soon__tilt" type="button" data-kwad-tilt>
    Tap to let it follow you
  </button>

</main>

<script src="./assets/kwadzilla-splash.js" defer></script>
</body>
